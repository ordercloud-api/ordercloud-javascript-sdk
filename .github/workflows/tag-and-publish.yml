name: Tag, Release, & Publish

permissions:
  contents: write
  id-token: write
  
on:
  push:
    branches:
      - master
      - ci/npm-trusted-publishing

jobs:
  verify-trusted-publishing:
    if: github.ref == 'refs/heads/ci/npm-trusted-publishing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check npm version
        run: npm --version

      - name: Exchange OIDC token with npm
        run: |
          node --input-type=module <<'NODE'
          const audience = "npm:registry.npmjs.org";
          const packageName = "ordercloud-javascript-sdk";
          const requestUrl = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
          const requestToken = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
          if (!requestUrl || !requestToken) {
            throw new Error("GitHub did not provide an OIDC token request endpoint.");
          }

          const separator = requestUrl.includes("?") ? "&" : "?";
          const identityResponse = await fetch(
            `${requestUrl}${separator}audience=${encodeURIComponent(audience)}`,
            { headers: { Authorization: `bearer ${requestToken}` } }
          );
          if (!identityResponse.ok) {
            throw new Error(`GitHub OIDC request failed (${identityResponse.status}).`);
          }
          const { value: identityToken } = await identityResponse.json();
          if (!identityToken) {
            throw new Error("GitHub OIDC response did not include an identity token.");
          }
          console.log(`::add-mask::${identityToken}`);

          const exchangeResponse = await fetch(
            `https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${encodeURIComponent(packageName)}`,
            { method: "POST", headers: { Authorization: `Bearer ${identityToken}` } }
          );
          const body = await exchangeResponse.json().catch(() => ({}));
          if (body.token) console.log(`::add-mask::${body.token}`);
          if (!exchangeResponse.ok || !body.token) {
            const detail = { ...body };
            delete detail.token;
            throw new Error(
              `npm rejected the trusted publisher (${exchangeResponse.status}): ${JSON.stringify(detail)}`
            );
          }
          console.log(`Trusted publishing accepted. Publish token expires ${body.expires ?? "unknown"}.`);
          NODE

  build:
    if: github.ref == 'refs/heads/master'
    runs-on: windows-latest # ubuntu throws error on build
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        registry-url: https://registry.npmjs.org

    - name: Install Dependencies
      run: npm i
      
    - name: Build
      run: npm run build

    - name: Extract Changelog Entry
      id: extract_changelog
      shell: pwsh
      run: |

        $version = (Get-Content package.json | ConvertFrom-Json).version
        Write-Host "Version: $version"

        # Set the path to your changelog file
        $changelogFile = "CHANGELOG.md"

        # Ensure the changelog file exists and read lines
        if (Test-Path $changelogFile) {
            $lines = Get-Content $changelogFile
            $changelogContent = ""
            $isCapturing = $false

            # Capture changelog content for the specified version
            foreach ($line in $lines) {
                # Check if we match the version header 
                if ($line -match "# \[$($version)\]") {
                    $isCapturing = $true
                    continue  
                }
                if ($isCapturing) {
                    $changelogContent += "$line`n"
                    # Stop when another version header is found (match format like '# [1.0.0]')
                    if ($line -match "# \[\d+\.\d+\.\d+\]") {
                        break  
                    }
                }
            }

            # Clean up changelog content
            if ($changelogContent) {
                $changelogContent = $changelogContent.Trim()
                $changelogContent = $changelogContent -replace "# \[\d+\.\d+\.\d+\] - \d{4}-\d{2}-\d{2}\s*", ""

                Write-Host "Changelog entry for version $version found!"
                Write-Host "Changelog content: $changelogContent"

                # Multiline values must use a delimiter. A single echo drops newlines
                # and can break the following release step. The closing delimiter
                # cannot be indented, so write the three parts separately.
                $changelogContent = $changelogContent -replace "`r", ""
                Add-Content -Path $env:GITHUB_OUTPUT -Value "changelog_content<<EOF" -Encoding utf8NoBOM
                Add-Content -Path $env:GITHUB_OUTPUT -Value $changelogContent -Encoding utf8NoBOM
                Add-Content -Path $env:GITHUB_OUTPUT -Value "EOF" -Encoding utf8NoBOM
            } else {
                Write-Host "No changelog entry found for version $version."
                exit 1
            }
        } else {
            Write-Host "Changelog file not found."
            exit 1
        }

    - name: Tag
      id: autotagger
      uses: Klemensas/action-autotag@stable
      with:
        tag_message: ${{ steps.extract_changelog.outputs.changelog_content }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Release
      id: create_release
      if: steps.autotagger.outputs.tagname != ''
      uses: actions/create-release@v1.0.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.autotagger.outputs.tagname }}
        release_name: ${{ steps.autotagger.outputs.tagname }}
        body: ${{ steps.extract_changelog.outputs.changelog_content }}
        draft: false

    - name: Publish to npm
      if: steps.autotagger.outputs.tagname != ''
      run: npm publish --access public
